name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow numpy pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build labpbr2bedrock.spec

      - name: Package release zip
        run: |
          dir dist
          python scripts/make_exe_release.py
          dir dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: labpbr2bedrock ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/labpbr2bedrock-*-win64.zip
